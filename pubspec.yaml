name: cartsense_lite
description: CartSense Lite Android-first supermarket receipt companion.
publish_to: none
version: 0.7.1+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  http: ^1.3.0
  http_parser: ^4.1.2
  flutter_image_compress: 2.4.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
