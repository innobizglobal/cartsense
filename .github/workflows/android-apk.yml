name: Test and build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - cartsense-android-build

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out CartSense
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure stable CartSense beta signing
        env:
          CARTSENSE_KEYSTORE_BASE64: ${{ secrets.CARTSENSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$CARTSENSE_KEYSTORE_BASE64"
          printf '%s' "$CARTSENSE_KEYSTORE_BASE64" | base64 --decode > android/app/cartsense-beta.jks

      - name: Build release APK
        env:
          CARTSENSE_KEYSTORE_FILE: ${{ github.workspace }}/android/app/cartsense-beta.jks
          CARTSENSE_KEYSTORE_PASSWORD: ${{ secrets.CARTSENSE_KEYSTORE_PASSWORD }}
          CARTSENSE_KEY_ALIAS: ${{ secrets.CARTSENSE_KEY_ALIAS }}
          CARTSENSE_KEY_PASSWORD: ${{ secrets.CARTSENSE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare and validate installable APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CartSense.apk
          test -s CartSense.apk
          sha256sum CartSense.apk | tee CartSense.apk.sha256

      - name: Upload CartSense APK
        uses: actions/upload-artifact@v4
        with:
          name: CartSense-Android
          path: |
            CartSense.apk
            CartSense.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/cartsense-beta.jks
